<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drac 2D · Vallclara</title><style>body{margin:0;padding:24px;background:#162523;color:#eee3ca;font:16px system-ui}main{max-width:850px;margin:auto}a{color:#e5c582}h1{font:44px Georgia}p{line-height:1.6;color:#c5cdbb}select{padding:10px;background:#294034;color:#f3e5c5;border:1px solid #718367;border-radius:5px}#dragon{width:min(76vw,512px);height:min(76vw,512px);margin:20px auto;background-image:url('./assets/dragon-flight-2d.webp');background-size:600% 400%;background-repeat:no-repeat}.stage{background:radial-gradient(ellipse,#4b634f,#20362d 70%);border:1px solid #54715d;border-radius:12px;margin-top:20px}</style></head><body><main><a href="./">← Tornar a Vallclara</a> · <a href="./personatges.html">Personatges</a><h1>El drac de les dues ribes.</h1><p>Un drac 2D amb 24 fotogrames dibuixats. Al joc sobrevola les cases cada dia a les 10:00 i les 17:00.</p><label>Orientació <select id="view"><option value="0">De cara</option><option value="1">Perfil esquerre</option><option value="2">D’esquena</option><option value="3">Perfil dret</option></select></label><label><input id="pause" type="checkbox"> Pausar animació</label><div class="stage"><div id="dragon" role="img" aria-label="Drac verd 2D batent les ales"></div></div></main><script>const dragon=document.querySelector('#dragon'),view=document.querySelector('#view'),pause=document.querySelector('#pause');let last=0,elapsed=0;function tick(now){if(!pause.checked)elapsed+=Math.min(.1,(now-last)/1000);last=now;const frame=Math.floor(elapsed*8)%6;dragon.style.backgroundPosition=`${frame/5*100}% ${Number(view.value)/3*100}%`;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></body></html>
