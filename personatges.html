<!doctype html>
<html lang="ca"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personatges · Vallclara</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#162523;color:#ede3c9;font:16px system-ui}header{max-width:1180px;margin:auto;padding:32px 24px 16px}a{color:#e5c582}h1{font:clamp(30px,5vw,54px) Georgia;margin:16px 0}p{color:#bfc7b5;max-width:700px;line-height:1.6}.controls{display:flex;flex-wrap:wrap;gap:12px;position:sticky;top:0;background:#162523f5;padding:16px 24px;z-index:1;border-bottom:1px solid #46594c}label{font-size:13px}select{display:block;background:#263b33;color:#f2e7cd;border:1px solid #6f7a5b;border-radius:6px;padding:9px;margin-top:5px}main{max-width:1180px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}article{text-align:center;border:1px solid #42574a;border-radius:10px;background:radial-gradient(ellipse at 50% 80%,#475549,#24372e 70%);padding:12px 4px}article b{display:block;font-size:13px;color:#e6ce9b;margin-top:8px}article small{font-size:11px;color:#b5c5b1}.figure{width:112px;height:128px;margin:auto;background-size:600% 800%;image-rendering:auto}.number{font-size:11px;text-align:left;padding-left:10px;color:#9daf98}footer{padding:24px;text-align:center;color:#a6b7a2}
</style>
<header><a href="./">← Tornar a Vallclara</a><h1>Les cares de Vallclara.</h1><p>Infants, adults i gent gran amb dibuixos propis. Cada personatge té sis fotogrames de caminar i sis de repòs en cadascuna de les quatre direccions.</p></header>
<div class="controls"><label>Personatges<select id="category"><option value="all">Tots</option><option value="boy">Nens</option><option value="girl">Nenes</option><option value="adult-male">Homes</option><option value="adult-female">Dones</option><option value="elder-male">Avis</option><option value="elder-female">Àvies</option><option value="priest">Sacerdot</option></select></label><label>Orientació<select id="view"><option value="0">Davant</option><option value="1">Dreta</option><option value="2">Esquena</option><option value="3">Esquerra</option></select></label><label>Animació<select id="state"><option value="idle">Repòs</option><option value="walk">Caminar</option><option value="pause">Pausa</option></select></label></div>
<main aria-label="Galeria dels personatges"></main><footer>Vallclara · Dejoco Arts</footer>
<script type="module">
import {RESIDENT_ROSTER,PLANNED_RESIDENT_ROSTER} from './resident-roster.js';
import {drawnFrame} from './animation-frames.js';
document.querySelector('option[value=all]').textContent=`Tots · ${RESIDENT_ROSTER.length}`;
document.querySelector('header p').prepend(`${RESIDENT_ROSTER.length} dissenys disponibles dels ${PLANNED_RESIDENT_ROSTER.length} previstos. `);
const labels={'adult-male':'Home','adult-female':'Dona','elder-male':'Avi','elder-female':'Àvia',boy:'Nen',girl:'Nena',priest:'Sacerdot'};
const names={'baker':'Forner','baker-wife':'Fornera','fisherman':'Pescador','fishmonger':'Peixatera','carpenter':'Fuster','weaver':'Teixidora','shepherd':'Pastor','shepherdess':'Pastora','boy-baker':'Fill dels forners','girl-baker':'Filla dels forners','stonemason':'Picapedrer','potter-wife':'Terrissaire'};
const cards=[],active=new Set(),height=matchMedia('(max-width:700px)').matches?96:128;
const observer=new IntersectionObserver(entries=>{for(const {target,isIntersecting} of entries){const card=cards.find(c=>c.article===target);if(isIntersecting){if(!card.loaded){card.figure.style.backgroundImage=`url(./assets/packed/${card.resident.id}-${height}.webp)`;card.loaded=true;}active.add(card);lastFrame='';}else active.delete(card);}},{rootMargin:'200px'});
RESIDENT_ROSTER.forEach((resident,i)=>{const article=document.createElement('article'),number=document.createElement('div'),figure=document.createElement('div'),name=document.createElement('b'),caption=document.createElement('small');number.className='number';number.textContent=String(i+1).padStart(2,'0');figure.className='figure';figure.role='img';figure.setAttribute('aria-label',`${labels[resident.category]} · disseny ${i+1}`);name.textContent=names[resident.id]??`${labels[resident.category]} ${i+1}`;caption.textContent='48 fotogrames';article.append(number,figure,name,caption);document.querySelector('main').append(article);cards.push({article,figure,resident,loaded:false});observer.observe(article);});
document.querySelector('#category').onchange=event=>{for(const c of cards)c.article.hidden=event.target.value!=='all'&&c.resident.category!==event.target.value;};
let frozen=6,lastFrame='';
function draw(now){const state=document.querySelector('#state').value,view=Number(document.querySelector('#view').value),frame=state==='pause'?frozen:drawnFrame({walk:state==='walk'?1:0,phase:now/160/6*Math.PI*2,idleTime:now/1000});frozen=frame;const key=`${frame}:${view}`;if(key!==lastFrame){for(const c of active)c.figure.style.backgroundPosition=`${frame%6/5*100}% ${(view+(frame>=6?4:0))/7*100}%`;lastFrame=key;}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
