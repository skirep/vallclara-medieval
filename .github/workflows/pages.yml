name: Deploy Vallclara to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned Three.js and CC0 photographic materials
        run: bash scripts/fetch-assets.sh
      - name: Verify simulation, geometry and navigation
        run: npm test
      - name: Prepare clean static artifact
        run: |
          mkdir _site
          cp index.html personatges.html style.css main.js house-geometry.js newcomers.js newcomer-layouts.js newcomer-action-layouts.js flirt-dialogue.js town-population.js castle.js church.js royal-court.js world.js interiors.js scenery.js terrain.js actors.js people-sprites.js resident-shadows.js resident-assets.js resident-roster.js featured-residents.js featured-layouts.js resident-scale.js resident-actions.js action-layouts.js sprite-atlas.js animation-frames.js resident-layouts.js walk-layouts.js appearance.js sprite-motion.js families.js simulation.js village-clock.js assembly-navigation.js assemblies.js daily-reports.js materials.js graphics.js nature.js stories.js social.js chronicles.js village-lore.js village-narrative.js dialogue-catalogue.js resident-tasks.js resident-work.js work-visuals.js _site/
          cp -r vendor assets _site/
          python3 scripts/version-site.py _site "$GITHUB_SHA"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
